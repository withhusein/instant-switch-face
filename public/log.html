<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pDOOH Telemetry & Logs Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0d1117; color: #c9d1d9; font-family: monospace; padding: 20px; }
        h1 { color: #58a6ff; margin-bottom: 20px; font-size: 1.5rem; display: flex; align-items: center; gap: 10px; }
        .controls { margin-bottom: 15px; display: flex; gap: 10px; align-items: center; }
        button { padding: 8px 16px; background: #238636; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2ea043; }
        .table-container { overflow-x: auto; border: 1px solid #30363d; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; background: #161b22; }
        th, td { border: 1px solid #30363d; padding: 12px; text-align: left; font-size: 0.85rem; }
        th { background: #21262d; color: #f0f6fc; }
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.75rem; display: inline-block; }
        .READY_FOR_DOOH { background: #238636; color: white; }
        .PROCESSING_IN_AI { background: #9e6a03; color: white; }
        .PLAYED_ON_VIDEOTRON { background: #1f6beb; color: white; }
        .FAILED_IN_AI { background: #da3633; color: white; }
        .time-block { font-size: 0.75rem; color: #8b949e; line-height: 1.4; }
    </style>
</head>
<body>

<h1>📊 pDOOH Telemetry & Performance Logs</h1>

<div class="controls">
    <button onclick="fetchLogs()">🔄 Refresh Data</button>
    <span id="lastUpdated" style="font-size: 0.8rem; color: #8b949e;"></span>
</div>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>Job ID / User</th>
                <th>Status</th>
                <th>Raw Size</th>
                <th>Compressed</th>
                <th>Result Size</th>
                <th>AI Latency</th>
                <th>Total Latency</th>
                <th>Timestamps (T1 ➔ T4 ➔ T5)</th>
            </tr>
        </thead>
        <tbody id="logTable">
            <tr><td colspan="8" style="text-align:center; color:#8b949e;">Memuat data log...</td></tr>
        </tbody>
    </table>
</div>

<script>
    async function fetchLogs() {
        const tbody = document.getElementById('logTable');
        const lastUpdated = document.getElementById('lastUpdated');
        
        try {
            const res = await fetch('/api/log');
            if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
            
            const data = await res.json();
            tbody.innerHTML = '';
            lastUpdated.innerText = 'Diperbarui pada: ' + new Date().toLocaleTimeString();

            if (!data.logs || data.logs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; color:#8b949e; padding: 20px;">Belum ada log terekam. Kirim foto baru dari Microsite untuk memunculkan telemetri!</td></tr>';
                return;
            }

            data.logs.forEach(log => {
                const tr = document.createElement('tr');
                
                const t1 = log.timestamps?.t1_microsite_uploaded ? new Date(log.timestamps.t1_microsite_uploaded).toLocaleTimeString() : '-';
                const t4 = log.timestamps?.t4_webhook_completed ? new Date(log.timestamps.t4_webhook_completed).toLocaleTimeString() : '-';
                const t5 = log.timestamps?.t5_player_fetched ? new Date(log.timestamps.t5_player_fetched).toLocaleTimeString() : '-';

                tr.innerHTML = `
                    <td><b>${log.userName || 'User'}</b><br><small style="color:#8b949e">${log.jobId || '-'}</small></td>
                    <td><span class="badge ${log.status}">${log.status}</span></td>
                    <td>${log.assetMetrics?.rawUploadSizeKB || 0} KB</td>
                    <td>${log.assetMetrics?.frontendCompressedSizeKB || 0} KB</td>
                    <td>${log.assetMetrics?.processedAssetSizeKB ? log.assetMetrics.processedAssetSizeKB + ' KB' : '-'}</td>
                    <td><b>${log.durations?.aiProcessingTimeSec ? log.durations.aiProcessingTimeSec + ' s' : '-'}</b></td>
                    <td><b>${log.durations?.totalLatencySec ? log.durations.totalLatencySec + ' s' : '-'}</b></td>
                    <td class="time-block">
                        T1 (Upload): ${t1}<br>
                        T4 (AI Done): ${t4}<br>
                        T5 (Player): ${t5}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (err) {
            console.error("Fetch Log Error:", err);
            tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:#ff7b72; padding: 20px;">Gagal memuat log: ${err.message}</td></tr>`;
        }
    }

    // Jalankan pertama kali & auto-refresh tiap 3 detik
    fetchLogs();
    setInterval(fetchLogs, 3000);
</script>
</body>
</html>
