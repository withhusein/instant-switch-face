<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join The Race! - pDOOH</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #1e1e1e; padding: 25px; border-radius: 12px; width: 100%; max-width: 420px; text-align: center; }
        input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 6px; border: none; }
        input[type="text"] { background: #2a2a2a; color: #fff; }
        button { background: #e50914; color: white; font-weight: bold; cursor: pointer; }
        button:disabled { background: #444; }
        .preview { width: 120px; height: 120px; border-radius: 50%; border: 3px solid #e50914; margin: 15px auto; overflow: hidden; }
        .preview img { width: 100%; height: 100%; object-fit: cover; }
        #status { margin-top: 15px; font-size: 0.85rem; color: #ffcc00; }
    </style>
</head>
<body>

<div class="card">
    <h2>Join The Race! 🏎️</h2>
    <p style="color:#aaa; font-size:0.85rem; margin-top:5px;">Upload foto untuk tayang di Videotron</p>

    <form id="uploadForm">
        <input type="text" id="userName" placeholder="Nama Kamu" required>
        <input type="file" id="userImage" accept="image/*" required>

        <div class="preview">
            <img id="imgPreview" src="template.jpg">
        </div>

        <button type="submit" id="btnSubmit">KIRIM FOTO</button>
    </form>

    <div id="status"></div>
</div>

<script>
    let base64Data = null;
    let rawSizeKB = 0;
    let compressedSizeKB = 0;

    const userImageInput = document.getElementById('userImage');
    const imgPreview = document.getElementById('imgPreview');
    const form = document.getElementById('uploadForm');
    const statusDiv = document.getElementById('status');
    const btnSubmit = document.getElementById('btnSubmit');

    userImageInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            rawSizeKB = (file.size / 1024).toFixed(2);
            
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX = 1080;
                    let w = img.width, h = img.height;
                    if (w > h) { if (w > MAX) { h *= MAX / w; w = MAX; } }
                    else { if (h > MAX) { w *= MAX / h; h = MAX; } }

                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);

                    base64Data = canvas.toDataURL('image/jpeg', 0.8);
                    imgPreview.src = base64Data;

                    // Hitung ukuran kompresi
                    const stringLength = base64Data.length - 'data:image/jpeg;base64,'.length;
                    const sizeInBytes = 4 * Math.ceil(stringLength / 3) * 0.5624896;
                    compressedSizeKB = (sizeInBytes / 1024).toFixed(2);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }
    });

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        btnSubmit.disabled = true;
        statusDiv.innerText = 'Mengirim & Merekam Telemetri...';

        try {
            const res = await fetch('/api/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userName: document.getElementById('userName').value,
                    userImageUrl: base64Data,
                    rawSizeKB: parseFloat(rawSizeKB),
                    compressedSizeKB: parseFloat(compressedSizeKB)
                })
            });

            const data = await res.json();
            if (!res.ok) throw new Error(data.error);

            statusDiv.innerHTML = `
                <span style="color:#00ff66;">
                    ✅ Foto Diterima!<br>
                    Ukuran Asli: ${rawSizeKB} KB | Dikitkan: ${compressedSizeKB} KB<br>
                    Silakan lihat ke layar Videotron dalam beberapa saat.
                </span>
            `;
        } catch (err) {
            statusDiv.innerText = 'Error: ' + err.message;
            btnSubmit.disabled = false;
        }
    });
</script>
</body>
</html>
