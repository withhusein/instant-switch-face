<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>pDOOH Telemetry & Logs Dashboard</title>
    <style>
        body { background: #0d1117; color: #c9d1d9; font-family: monospace; padding: 20px; }
        h1 { color: #58a6ff; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; background: #161b22; margin-top: 10px; }
        th, td { border: 1px solid #30363d; padding: 10px; text-align: left; font-size: 0.85rem; }
        th { background: #21262d; color: #f0f6fc; }
        .badge { padding: 3px 8px; border-radius: 4px; font-weight: bold; }
        .READY_FOR_DOOH { background: #238636; color: white; }
        .PROCESSING_IN_AI { background: #9e6a03; color: white; }
        .PLAYED_ON_VIDEOTRON { background: #1f6beb; color: white; }
        button { padding: 8px 16px; background: #238636; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<h1>📊 pDOOH Telemetry & Performance Logs</h1>
<button onclick="fetchLogs()">🔄 Refresh Data</button>

<table>
    <thead>
        <tr>
            <th>Job ID / User</th>
            <th>Status</th>
            <th>Raw Size</th>
            <th>Compressed</th>
            <th>Result Size</th>
            <th>AI Latency</th>
            <th>Total Latency</th>
            <th>Timestamps (T1 ➔ T4 ➔ T5)</th>
        </tr>
    </thead>
    <tbody id="logTable">
        <tr><td colspan="8">Memuat data log...</td></tr>
    </tbody>
</table>

<script>
    async function fetchLogs() {
        const res = await fetch('/api/logs');
        const data = await res.json();
        const tbody = document.getElementById('logTable');
        tbody.innerHTML = '';

        if (!data.logs || data.logs.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8">Belum ada log terekam.</td></tr>';
            return;
        }

        data.logs.forEach(log => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><b>${log.userName}</b><br><small style="color:#8b949e">${log.jobId}</small></td>
                <td><span class="badge ${log.status}">${log.status}</span></td>
                <td>${log.assetMetrics.rawUploadSizeKB || 0} KB</td>
                <td>${log.assetMetrics.frontendCompressedSizeKB || 0} KB</td>
                <td>${log.assetMetrics.processedAssetSizeKB || '-'} KB</td>
                <td><b>${log.durations.aiProcessingTimeSec || '-'} s</b></td>
                <td><b>${log.durations.totalLatencySec || '-'} s</b></td>
                <td style="font-size:0.75rem; color:#8b949e">
                    T1: ${log.timestamps.t1_microsite_uploaded || '-'}<br>
                    T4: ${log.timestamps.t4_webhook_completed || '-'}<br>
                    T5: ${log.timestamps.t5_player_fetched || '-'}
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    fetchLogs();
    setInterval(fetchLogs, 5000); // Auto-refresh tiap 5 detik
</script>
</body>
</html>
