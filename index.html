<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instant Switch Face - Racer</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #111; color: #fff; text-align: center; }
    .form-group { margin-bottom: 15px; }
    input { padding: 10px; width: 80%; max-width: 300px; margin-top: 5px; }
    button { padding: 12px 24px; background: #e50914; color: white; border: none; font-weight: bold; cursor: pointer; }
    #resultImg { width: 100%; max-width: 350px; margin-top: 20px; border-radius: 8px; display: none; }
  </style>
</head>
<body>
  <h2>Join The Race! 🏎️</h2>
  <p>Upload foto wajahmu untuk jadi Racer berikutnya.</p>

  <form id="uploadForm">
    <div class="form-group">
      <input type="text" id="userName" placeholder="Nama Kamu" required />
    </div>
    <div class="form-group">
      <!-- Input URL Foto sementara untuk kemudahan testing tanpa storage tambahan -->
      <input type="url" id="userPhotoUrl" placeholder="Paste URL Foto Wajah (PNG/JPG)" required />
    </div>
    <button type="submit" id="btnSubmit">SUBMIT FOTO</button>
  </form>

  <p id="status"></p>
  <img id="resultImg" src="" alt="Hasil AI" />

  <script>
    const VERCEL_BACKEND_URL = "/api/submit"; // GANTI DENGAN URL VERCEL ANDA

    const form = document.getElementById('uploadForm');
    const statusText = document.getElementById('status');
    const resultImg = document.getElementById('resultImg');
    const btnSubmit = document.getElementById('btnSubmit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const userName = document.getElementById('userName').value;
      const userPhotoUrl = document.getElementById('userPhotoUrl').value;

      statusText.innerText = 'Mengirim data ke AI... Mohon tunggu (~5 detik)';
      btnSubmit.disabled = true;
      resultImg.style.display = 'none';

      try {
        const response = await fetch(VERCEL_BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userName: userName,
            userImageUrl: userPhotoUrl
          })
        });

        const data = await response.json();

        if (data.success) {
          statusText.innerText = `Berhasil! Wajah ${data.asset.userName} sudah diswap.`;
          resultImg.src = data.asset.url;
          resultImg.style.display = 'inline-block';
        } else {
          statusText.innerText = 'Gagal memproses: ' + (data.error || 'Terjadi kesalahan');
        }
      } catch (err) {
        console.error(err);
        statusText.innerText = 'Error koneksi ke backend Vercel.';
      } finally {
        btnSubmit.disabled = false;
      }
    });
  </script>
</body>
</html>
